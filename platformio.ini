[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
    ; Decoder only (no I2S driver of its own). Not in the PlatformIO registry, so pinned to a release tag.
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
